name: Release tarball (GitHub Releases)

# Builds the module and attaches the packed .tgz to a GitHub Release, so it can be
# consumed WITHOUT publishing to the npm registry:
#
#   "npm": "@stssocialst-stp/fe-social_protection@https://github.com/stssocialst-stp/openimis-fe-social_protection_js/releases/download/<tag>/<file>.tgz"
#
# Trigger it by pushing a version tag (e.g. `git tag v0.1.4 && git push origin v0.1.4`)
# or manually from the Actions tab (uses the version from package.json).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Pack
        run: npm pack --ignore-scripts

      - name: Upload tarball to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "Using tag: ${TAG}"

          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" --target "${GITHUB_SHA}" --title "${TAG}" --generate-notes
          fi

          gh release upload "${TAG}" ./*.tgz --clobber

          echo "Tarball URL: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename ./*.tgz)"
